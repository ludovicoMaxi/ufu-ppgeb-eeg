spring.jpa.database=POSTGRESQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Credenciais e URL devem ser fornecidas por variaveis de ambiente (nunca em codigo)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eeg}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

app.security.users.joaol.password=${APP_SECURITY_JOAO_PASSWORD}
app.security.users.teste.password=${APP_SECURITY_TESTE_PASSWORD}
app.security.users.user.password=${APP_SECURITY_USER_PASSWORD}

# Em producao o schema e gerenciado por migracoes (Flyway/Liquibase), nunca pelo Hibernate
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# Seguranca: desabilitar H2 console e DevTools em producao
spring.h2.console.enabled=false
spring.boot.devtools.restart.enabled=false
