<!DOCTYPE html>
<html lang='pt-BR'>

<head>
  <meta charset='utf-8' />
  <meta name='viewport' content='width=device-width, initial-scale=1' />
  <title>Login - UFU PPGEB EEG</title>
  <link rel='stylesheet' th:href='@{/public/app.css(v=${cacheVersion})}' href='/public/app.css' />
</head>

<body class='login-page bg-body-secondary'>
  <div class='login-box'>
    <div class='login-logo'>
      <a href='#'><b>UFU</b> PPGEB EEG</a>
    </div>
    <div class='card'>
      <div class='card-body login-card-body'>
        <p class='login-box-msg'>Faça login para iniciar sua sessão</p>

        <form th:action='@{/login}' method='post'>
          <input type='hidden' th:name='${_csrf.parameterName}' th:value='${_csrf.token}' />

          <div th:if='${param.error}' class='alert alert-danger' role='alert'>Usuário ou senha inválidos.</div>
          <div th:if='${param.logout}' class='alert alert-success' role='status'>Você saiu da aplicação.</div>

          <div class='input-group mb-3'>
            <input type='text' id='username' name='username' class='form-control'
              placeholder='Usuário' aria-label='Usuário' autocomplete='username' autofocus required />
            <div class='input-group-text'><span class='fa fa-user' aria-hidden='true'></span></div>
          </div>

          <div class='input-group mb-3'>
            <input type='password' id='password' name='password' class='form-control'
              placeholder='Senha' aria-label='Senha' autocomplete='current-password' required />
            <div class='input-group-text'><span class='fa fa-lock' aria-hidden='true'></span></div>
          </div>

          <div class='row'>
            <div class='col-12'>
              <button type='submit' class='btn btn-primary w-100'>Entrar</button>
            </div>
          </div>
        </form>
      </div>
    </div>
    <p class='text-center text-secondary small mt-3'>PPGEB - EEG</p>
  </div>
</body>

</html>
