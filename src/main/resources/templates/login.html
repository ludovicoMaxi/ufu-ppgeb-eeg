<!DOCTYPE html>
<html lang='pt-BR'>

<head>
  <meta charset='utf-8' />
  <meta name='viewport' content='width=device-width, initial-scale=1' />
  <title>Login - UFU PPGEB EEG</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f4f6f9;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-box { width: 100%; max-width: 380px; margin: 1rem; }
    .card {
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 0 1rem rgba(0, 0, 0, .1);
      padding: 2rem;
    }
    h1 { font-size: 1.4rem; margin: 0 0 1.5rem; text-align: center; color: #343a40; }
    label { display: block; margin-bottom: .4rem; color: #495057; font-size: .9rem; }
    input {
      width: 100%;
      padding: .55rem .75rem;
      margin-bottom: 1rem;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: .6rem;
      background: #007bff;
      color: #fff;
      border: 0;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #0069d9; }
    .alert {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      border-radius: 4px;
      padding: .75rem;
      margin-bottom: 1rem;
      font-size: .9rem;
    }
    .info { text-align: center; margin-top: 1rem; color: #6c757d; font-size: .85rem; }
  </style>
</head>

<body>
  <div class='login-box'>
    <div class='card'>
      <h1>UFU PPGEB EEG</h1>
      <form th:action='@{/login}' method='post'>
          <input type='hidden' th:name='${_csrf.parameterName}' th:value='${_csrf.token}' />
          <div th:if='${param.error}' class='alert'>Usuário ou senha inválidos.</div>
        <div th:if='${param.logout}' class='alert'>Você saiu da aplicação.</div>
        <label for='username'>Usuário</label>
        <input type='text' id='username' name='username' autofocus required />
        <label for='password'>Senha</label>
        <input type='password' id='password' name='password' required />
        <button type='submit'>Entrar</button>
      </form>
    </div>
    <div class='info'>PPGEB - EEG</div>
  </div>
</body>

</html>
