spring.jpa.database=POSTGRESQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# PostgreSQL local (HOM). Usuario e senha sao obrigatorios e vem de variaveis de ambiente (sem valor padrao).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ufu_ppgeb_eeg}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Senhas dos usuarios de aplicacao: obrigatorias em HOM
app.security.users.joaol.password=${APP_SECURITY_JOAO_PASSWORD}
app.security.users.teste.password=${APP_SECURITY_TESTE_PASSWORD}
app.security.users.user.password=${APP_SECURITY_USER_PASSWORD}

# Schema criado/atualizado pelo Hibernate na primeira subida. Apos a carga inicial,
# troque para "validate" para impedir alteracoes automaticas no schema.
spring.jpa.hibernate.ddl-auto=validate

# A carga inicial e feita manualmente (scripts/hom/carga_inicial_postgres.sql), nao a cada subida
spring.sql.init.mode=never

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# Desabilitar H2 console e DevTools em HOM
spring.h2.console.enabled=false
spring.boot.devtools.restart.enabled=false
