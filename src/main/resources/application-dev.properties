spring.datasource.url=jdbc:h2:mem:crm_maxi_caetano
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true

server.port=8080

# Apenas para desenvolvimento local; use senhas fortes fora deste perfil.
app.security.users.joaol.password=${APP_SECURITY_JOAO_PASSWORD:123}
app.security.users.teste.password=${APP_SECURITY_TESTE_PASSWORD:123}
app.security.users.user.password=${APP_SECURITY_USER_PASSWORD:123}

# H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:/populate_db_dev.sql
