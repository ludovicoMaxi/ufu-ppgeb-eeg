spring.application.name=ufu-ppgeb-eeg

spring.jackson.time-zone=America/Sao_Paulo

# Timezone usada pelo JDBC/Hibernate na leitura e gravacao de datas com fuso
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# A serializacao das entidades nao depende de sessao aberta (colecoes do Exam sao EAGER/SUBSELECT)
spring.jpa.open-in-view=false

# Desenvolvimento e o padrao local; producao deve definir SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

# Endurecimento: nao expor detalhes de erro a qualquer cliente
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never

# Endurecimento: details de health apenas para autorizados
management.endpoint.health.show-details=when-authorized

# Actuator: expor apenas health e info publicamente
management.endpoints.web.exposure.include=health,info
management.endpoint.info.enabled=true

# Compressao HTTP de respostas de texto
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript

# Virtual threads (Java 21+; projeto usa Java 25)
spring.threads.virtual.enabled=true

# Hibernate: JDBC batching para gravacoes em massa (5-30)
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Hibernate: log de consultas lentas
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=1000
